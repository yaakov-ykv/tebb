<script src="./Teachers' Day QR Code_files/qrcode.min.js.download"></script>
<script>
var $=function(id){return document.getElementById(id)};
try{if(qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs['UTF-8'])qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8']}catch(e){}
function enc(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function vals(){return{t:$('title').value.trim(),m:$('msg').value.trim(),f:$('from').value.trim()}}
function linkUrl(){var v=vals();return $('base').value.trim().split('#')[0]+'#g='+enc(JSON.stringify([v.t,v.m,v.f]))}
function qrText(){
  var v=vals();
  return document.querySelector('input[name=mode]:checked').value==='text'?v.m+(v.f?'\n\n\u2014 '+v.f:''):linkUrl();
}
function render(){
  var v=vals(),box=$('qr'),card=$('card');
  $('oTitle').textContent=v.t;$('oCap').textContent=$('cap').value;
  $('count').textContent=v.m.length+' / 1500';
  $('open').href=linkUrl();
  box.innerHTML='';$('dens').textContent='';
  if(!v.m){box.innerHTML='<div class="err">Type a message to make a code.</div>';return}
  try{
    var qr=qrcode(0,'L');qr.addData(qrText());qr.make();
    var n=qr.getModuleCount(),d='',r,c,s=n+8;
    for(r=0;r<n;r++)for(c=0;c<n;c++)if(qr.isDark(r,c))d+='M'+(c+4)+' '+(r+4)+'h1v1h-1z';
    box.innerHTML='<svg viewBox="0 0 '+s+' '+s+'" width="100%" role="img" aria-label="QR code" shape-rendering="crispEdges"><rect width="'+s+'" height="'+s+'" fill="#fff"/><path d="'+d+'" fill="#1d2b25"/></svg>';
    var big=n>57;
    card.style.maxWidth=big?'640px':'420px';box.style.maxWidth=big?'560px':'280px';
    $('dens').textContent=n<=57?'Easy to scan.':n<=105?'Dense code. Print it at least 8 cm wide.':'Very dense code. Print it at least 12 cm wide, or shorten the message.';
  }catch(e){
    box.innerHTML='<div class="err">Too long for one code. Shorten the message a little.</div>';
  }
}
['title','msg','from','cap','base'].forEach(function(id){$(id).addEventListener('input',render)});
document.querySelectorAll('input[name=mode]').forEach(function(r){r.addEventListener('change',render)});
render();
</script>
